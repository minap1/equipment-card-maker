<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipment Card Maker</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--text:#1f1d1a;--muted:#6b665d;--line:#d8d2c4;--accent:#8a5a1c;--card:#fbf6e8;--cardtext:#2a2118;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--panel:#221f1b;--text:#efe9dc;--muted:#a39b8b;--line:#3a352d;--accent:#d9a14e;--card:#2b261e;--cardtext:#f1e9d6}}
:root[data-theme="dark"]{--bg:#171512;--panel:#221f1b;--text:#efe9dc;--muted:#a39b8b;--line:#3a352d;--accent:#d9a14e;--card:#2b261e;--cardtext:#f1e9d6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.2rem;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:24px}
.maker{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:720px){.maker{grid-template-columns:1fr}.preview{order:-1}}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:var(--text)}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{resize:vertical;min-height:80px}
input[type=range]{width:100%}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:.8rem;color:var(--muted);text-align:right}
.msg{min-height:1.4em;font-size:.9rem;color:var(--accent);margin-top:8px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
/* card */
.card{--tc:#777;width:100%;aspect-ratio:5/7;background:var(--card);color:var(--cardtext);border:6px solid var(--tc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden}
.card[data-type="Armor"]{--tc:#5b7fa6}.card[data-type="Weapon"]{--tc:#b2412f}.card[data-type="Magic Item"]{--tc:#7b4fb0}
.c-head{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:2px solid var(--tc);padding-bottom:4px}
.c-name{font-weight:700;font-size:1.05em;line-height:1.15;overflow-wrap:anywhere}
.c-frame{position:relative;flex:0 0 46%;border:3px solid var(--tc);border-radius:8px;overflow:hidden;background:rgba(128,128,128,.18);touch-action:none}
.c-frame.edit{cursor:grab}.c-frame.edit:active{cursor:grabbing}
.c-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.c-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:.8em;opacity:.6;text-align:center;padding:8px}
.c-type{align-self:flex-start;background:var(--tc);color:#fff;font-size:.7em;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:99px}
.c-desc{flex:1;border:1px solid var(--tc);border-radius:8px;padding:6px 8px;font-size:.8em;line-height:1.35;overflow:hidden;overflow-wrap:anywhere}
.c-text{font-style:italic}.c-desc div+.c-text{margin-top:.35em}
.preview .card{font-size:16px}
.card[data-corners="sharp"],.card[data-corners="sharp"] .c-frame,.card[data-corners="sharp"] .c-desc,.card[data-corners="sharp"] .c-type{border-radius:0}
/* library */
.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:16px}
@media(max-width:520px){.filters{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.grid .card{font-size:11px;padding:6px;border-width:4px}
.item .row{margin-top:8px}.item button{padding:4px 10px;font-size:.85rem}
.empty{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fbox .row{margin-top:8px}.fbox button{padding:2px 10px}
input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
[hidden]{display:none!important}
.tools{display:flex;align-items:center;gap:4px;margin:6px 0}
.tools .zi{flex:none;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);opacity:.55;cursor:default;user-select:none;margin-right:2px}
.tools input[type=range]{flex:1;width:auto;min-width:0;margin:0 6px 0 0}
.tools button{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:6px}
.tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.c-frame.cropmode{cursor:default}
.c-crop{position:absolute;inset:0;pointer-events:none}
.c-box{position:absolute;border:2px dashed #fff;outline:1px solid rgba(0,0,0,.6)}
.c-h{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;background:#fff;border:2px solid var(--accent);border-radius:3px;pointer-events:auto;touch-action:none}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-n{left:50%;top:0;cursor:ns-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}
.h-e{left:100%;top:50%;cursor:ew-resize}.h-se{left:100%;top:100%;cursor:nwse-resize}.h-s{left:50%;top:100%;cursor:ns-resize}
.h-sw{left:0;top:100%;cursor:nesw-resize}.h-w{left:0;top:50%;cursor:ew-resize}
</style>
</head>
<body>
<main>
  <h1>Equipment Card Maker</h1>
  <p class="sub">Build a trading card, tweak the photo right on the card, and save it to your browser’s library.</p>

  <section class="panel">
    <h2>Card Maker</h2>
    <div class="tabs"><button id="tab-orig" type="button" class="on">Original</button><button id="tab-cust" type="button">Custom</button></div>
    <div class="maker">
      <div class="controls">
        <label for="photo">Equipment photo</label>
        <input id="photo" type="file" accept="image/*">
        <label for="name">Equipment name</label>
        <input id="name" type="text" maxlength="40" placeholder="e.g. Dawnbreaker Longsword">
        <div id="orig-fields">
        <label for="type">Equipment type</label>
        <select id="type"><option>Armor</option><option selected>Weapon</option><option>Magic Item</option></select>
        <label for="stat" id="statlabel">Damage</label>
        <input id="stat" type="text" maxlength="160" placeholder="Optional">
        <label for="range">Range</label>
        <select id="range"></select>
        <label for="use">Use Cooldown (turns)</label>
        <input id="use" type="number" min="0" step="1" inputmode="numeric" placeholder="Optional">
        <label for="cost">Etching Cost (trace)</label>
        <input id="cost" type="number" min="0" step="1" inputmode="numeric" placeholder="Optional">
        <label for="etch">Etching</label>
        <input id="etch" type="text" maxlength="160" placeholder="Optional short description">
        </div>
        <div id="cust-fields" hidden>
          <label for="ctype">Equipment type</label>
          <input id="ctype" type="text" maxlength="24" placeholder="e.g. Potion, Vehicle, Relic">
          <label>Custom fields</label>
          <div id="fieldlist"></div>
          <div class="row"><button id="addfield" type="button">+ Add field</button></div>
        </div>
        <label for="desc">Description</label>
        <textarea id="desc" maxlength="160" placeholder="A blade that glows at first light."></textarea>
        <div class="count"><span id="dc">0</span>/160</div>
        <div class="row">
          <button id="reset" type="button">Reset photo</button>
          <button id="save" type="button" class="primary">Save card</button>
          <button id="new" type="button">New card</button>
          <button id="copy" type="button">Copy JSON</button>
          <button id="png" type="button">Export PNG</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </div>
      <div class="preview">
        <div id="live"></div>
        <div class="tools">
          <span class="zi" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
          <input id="zoom" type="range" step="0.01" value="1" aria-label="Photo zoom">
          <button id="tool-move" type="button" class="on" title="Move photo" aria-label="Move photo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
          <button id="tool-crop" type="button" title="Crop photo" aria-label="Crop photo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
        </div>
        <button id="corners" type="button">Corners: Rounded</button>
        <div id="colors" hidden>
          <label for="cborder">Border color</label><input id="cborder" type="color">
          <label for="cbg">Background color</label><input id="cbg" type="color">
        </div>
        <textarea id="import-item-json" placeholder="Paste item JSON."></textarea>
        <button id="import" type="button">Import JSON</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Search Previously Made Cards</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="Search by name or description">
      <select id="ft"><option value="">All types</option><option>Armor</option><option>Weapon</option><option>Magic Item</option><option>Custom</option></select>
    </div>
    <div id="lib" class="grid"></div>
    <div class="msg" id="libmsg" role="status"></div>
  </section>
</main>

<script>
const KEY = 'equipmentCards.v1';
const $ = id => document.getElementById(id);
let state = blank();
let mode = 'original';
let tool = 'move';   // 'move' drags the photo, 'crop' shows crop handles
const stash = {original:null, custom:null};   // unsaved work kept per tab

const MAX_FIELDS = 8;
const ZOOM_MIN = 0.5, ZOOM_MAX = 10;   // photo zoom limits: change these two numbers
$('zoom').min = ZOOM_MIN; $('zoom').max = ZOOM_MAX;
function blankCustom(){ return {kind:'custom',id:null,name:'',typeName:'',desc:'',fields:[],image:'',zoom:1,x:0,y:0,cropT:0,cropR:0,cropB:0,cropL:0,corners:'rounded',border:'#5b6b7a',bg:'#fbf6e8'}; }
function textOn(hex){   // readable text color for a background
  const n = parseInt(String(hex).slice(1), 16) || 0, r = n>>16&255, g = n>>8&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#2a2118' : '#f5efe0';
}
function intText(v){ const n = parseInt(v, 10); return Number.isFinite(n) ? String(n) : ''; }
function customLines(d){   // "Label: value unit", empty values skipped
  return (d.fields || []).map(f => {
    const val = String(f.value == null ? '' : f.value).trim(); if (!val) return null;
    const lab = String(f.label || '').trim(), unit = String(f.unit || '').trim();
    return (lab ? lab + ': ' : '') + val + (unit ? ' ' + unit : '');
  }).filter(Boolean);
}
function searchText(c){
  const extra = c.kind === 'custom' ? [c.typeName, ...(c.fields || []).flatMap(f => [f.label, f.value, f.unit])] : [];
  return [c.name, c.desc, ...extra].join(' ').toLowerCase();
}
function blank(){ return {id:null,name:'',type:'Weapon',desc:'',stat:'',range:'',use:'',cost:'',etch:'',image:'',zoom:1,x:0,y:0,cropT:0,cropR:0,cropB:0,cropL:0,corners:'rounded'}; }

const RANGE_OPTIONS = ['Close', 'Short', 'Medium', 'Long', 'Remote'];

function buildRangeSelect(){
  $('range').replaceChildren(
    new Option('None', ''),                       // empty value = not set
    ...RANGE_OPTIONS.map(o => new Option(o, o))
  );
}
buildRangeSelect();

const STAT_LABEL = {Weapon:'Damage', Armor:'Defense', 'Magic Item':'Effect'};
// Lines shown at the top of the description box; empty fields are skipped.
function lineList(d){
  const v = s => (s == null ? '' : String(s)).trim(), L = [];
  if (d.kind === 'custom') return customLines(d);
  const turns = n => n + (n === '1' ? ' turn' : ' turns');
  if (v(d.stat)) L.push(STAT_LABEL[d.type] + ': ' + v(d.stat));
  if (v(d.range)) L.push('Range: ' + v(d.range));
  if (v(d.use)) L.push('Use Cooldown: ' + turns(v(d.use)));
  if (v(d.cost)) L.push('Etching Cost: ' + v(d.cost) + ' trace');
  if (v(d.etch)) L.push('Etching: ' + v(d.etch));
  return L;
}
// Shrink the description text until it fits inside its box.
const dimCache = new Map();   // image size by source, so re-renders can crop without waiting for a reload
function imgDims(img){
  const k = img.src.length + img.src.slice(-48);
  if (img.naturalWidth) dimCache.set(k, [img.naturalWidth, img.naturalHeight]);
  return dimCache.get(k);
}
function cropGeom(fr){   // where the photo sits inside the frame, before zoom and pan
  const img = fr.querySelector('img'), dm = img && imgDims(img), fw = fr.clientWidth, fh = fr.clientHeight;
  if (!dm || !fw || !fh) return null;
  const sc = Math.min(fw/dm[0], fh/dm[1]), cw = dm[0]*sc, ch = dm[1]*sc;
  return {img, fw, fh, cw, ch, ox:(fw-cw)/2, oy:(fh-ch)/2};
}
function applyCrops(root){   // clip-path trims the photo; zoom and position are untouched
  root.querySelectorAll('.c-frame').forEach(fr => {
    const g = cropGeom(fr); if (!g) return;
    const [t, r, b, l] = (fr.dataset.crop || '0,0,0,0').split(',').map(Number);
    g.img.style.clipPath = `inset(${g.oy+g.ch*t}px ${g.ox+g.cw*r}px ${g.oy+g.ch*b}px ${g.ox+g.cw*l}px)`;
    const box = fr.querySelector('.c-box'); if (!box) return;
    const z = Number(fr.dataset.zoom) || 1, px = Number(fr.dataset.px) || 0, py = Number(fr.dataset.py) || 0;
    const X = v => g.fw/2 + (v - g.fw/2)*z + px*g.fw, Y = v => g.fh/2 + (v - g.fh/2)*z + py*g.fh;
    const x1 = X(g.ox+g.cw*l), x2 = X(g.ox+g.cw*(1-r)), y1 = Y(g.oy+g.ch*t), y2 = Y(g.oy+g.ch*(1-b));
    Object.assign(box.style, {left:x1+'px', top:y1+'px', width:(x2-x1)+'px', height:(y2-y1)+'px'});
  });
}
function buildCropBox(frame){   // dashed box with 8 drag handles; edits the crop in place
  const ov = document.createElement('div'); ov.className = 'c-crop';
  const box = document.createElement('div'); box.className = 'c-box'; ov.appendChild(box);
  ['nw','n','ne','e','se','s','sw','w'].forEach(h => {
    const hd = document.createElement('div'); hd.className = 'c-h h-' + h; box.appendChild(hd);
    let st = null;
    hd.addEventListener('pointerdown', ev => {
      const g = cropGeom(frame); if (!g) return;
      ev.stopPropagation(); hd.setPointerCapture(ev.pointerId);
      st = {x:ev.clientX, y:ev.clientY, g, T:state.cropT||0, R:state.cropR||0, B:state.cropB||0, L:state.cropL||0};
    });
    hd.addEventListener('pointermove', ev => {
      if (!st) return;
      const z = state.zoom, dx = (ev.clientX - st.x)/z/st.g.cw, dy = (ev.clientY - st.y)/z/st.g.ch;
      const lim = (v, opp) => Math.max(0, Math.min(v, 0.95 - opp));   // never crop everything
      if (h.includes('w')) state.cropL = lim(st.L + dx, st.R);
      if (h.includes('e')) state.cropR = lim(st.R - dx, st.L);
      if (h.includes('n')) state.cropT = lim(st.T + dy, st.B);
      if (h.includes('s')) state.cropB = lim(st.B - dy, st.T);
      frame.dataset.crop = [state.cropT, state.cropR, state.cropB, state.cropL].join(',');
      applyCrops(frame.parentNode);
    });
    const end = () => { st = null; };
    hd.addEventListener('pointerup', end); hd.addEventListener('pointercancel', end);
  });
  return ov;
}
function fitDesc(root){
  root.querySelectorAll('.c-desc').forEach(el => {
    let k = 1; el.style.fontSize = '';
    while (el.scrollHeight > el.clientHeight + 1 && k > 0.5){ k -= 0.05; el.style.fontSize = (0.8*k) + 'em'; }
  });
}

/* ---------- storage ---------- */
function loadAll(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
}
function saveAll(list){
  try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}

/* ---------- card rendering (shared by preview + library) ---------- */
function buildCard(d, editable){
  const c = document.createElement('div');
  c.className = 'card'; c.dataset.type = d.kind === 'custom' ? 'Custom' : d.type;
  if (d.kind === 'custom'){ c.style.setProperty('--tc', d.border); c.style.background = d.bg; c.style.color = textOn(d.bg); }
  c.dataset.corners = d.corners === 'sharp' ? 'sharp' : 'rounded';   // missing = rounded (older cards)
  const head = document.createElement('div'); head.className = 'c-head';
  const nm = document.createElement('div'); nm.className = 'c-name';
  nm.textContent = d.name || 'Unnamed Equipment';
  head.appendChild(nm);
  const frame = document.createElement('div');
  frame.className = 'c-frame' + (editable ? ' edit' : '') + (editable && tool === 'crop' ? ' cropmode' : '');
  if (d.image){
    const img = document.createElement('img');
    img.src = d.image; img.alt = '';
    frame.dataset.crop = [d.cropT, d.cropR, d.cropB, d.cropL].map(v => v || 0).join(',');
    frame.dataset.zoom = d.zoom; frame.dataset.px = d.x; frame.dataset.py = d.y;
    img.onload = () => applyCrops(c);
    img.style.transform = `translate(${d.x*100}%,${d.y*100}%) scale(${d.zoom})`;
    frame.appendChild(img);
    if (editable && tool === 'crop') frame.appendChild(buildCropBox(frame));
  } else {
    const ph = document.createElement('div'); ph.className = 'c-ph';
    ph.textContent = 'Upload a photo'; frame.appendChild(ph);
  }
  const ty = document.createElement('div'); ty.className = 'c-type'; ty.textContent = d.kind === 'custom' ? (d.typeName || 'Custom') : d.type;
  if (d.kind === 'custom') ty.style.color = textOn(d.border);
  const ds = document.createElement('div'); ds.className = 'c-desc';
  const ls = lineList(d), txt = (d.desc || '').trim();
  ls.forEach(t => { const r = document.createElement('div'); r.textContent = t; ds.appendChild(r); });
  if (txt || !ls.length){ const p = document.createElement('div'); p.className = 'c-text'; p.textContent = txt || 'Description goes here.'; ds.appendChild(p); }
  c.append(head, frame, ty, ds);
  if (editable) attachDrag(frame);
  return c;
}

function renderLive(){
  const host = $('live'); host.replaceChildren(buildCard(state, true)); fitDesc(host); applyCrops(host);
}

/* ---------- photo editing on the card ---------- */
function attachDrag(frame){
  let drag = null;
  frame.addEventListener('pointerdown', e => {
    if (!state.image || tool !== 'move') return;
    frame.setPointerCapture(e.pointerId);
    drag = {px:e.clientX, py:e.clientY, x:state.x, y:state.y, w:frame.clientWidth, h:frame.clientHeight};
  });
  frame.addEventListener('pointermove', e => {
    if (!drag) return;
    state.x = clampPan(drag.x + (e.clientX-drag.px)/drag.w);
    state.y = clampPan(drag.y + (e.clientY-drag.py)/drag.h);
    applyTransform(frame);
  });
  const end = () => { drag = null; };
  frame.addEventListener('pointerup', end);
  frame.addEventListener('pointercancel', end);
  frame.addEventListener('wheel', e => {
    if (!state.image) return;
    e.preventDefault();
    setZoom(state.zoom + (e.deltaY < 0 ? 0.08 : -0.08));
  }, {passive:false});
}
function clampPan(v){ const lim = Math.max(1, state.zoom/2); return Math.max(-lim, Math.min(lim, v)); }   // wider pan range when zoomed in
function applyTransform(frame){
  const img = frame.querySelector('img');
  if (img) img.style.transform = `translate(${state.x*100}%,${state.y*100}%) scale(${state.zoom})`;
  frame.dataset.zoom = state.zoom; frame.dataset.px = state.x; frame.dataset.py = state.y;
  if (frame.parentNode) applyCrops(frame.parentNode);
}
function setZoom(z){
  state.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  $('zoom').value = state.zoom;
  const f = $('live').querySelector('.c-frame'); if (f) applyTransform(f);
}

/* ---------- import JSON ---------- */
const FIELD_LIMITS = {name:40, desc:160, stat:160, use:10, cost:10, etch:60};

function applyShared(raw, card){   // photo, framing and corners: same rules for both kinds
  const ranges = {zoom: [ZOOM_MIN, ZOOM_MAX], x: [-ZOOM_MAX/2, ZOOM_MAX/2], y: [-ZOOM_MAX/2, ZOOM_MAX/2]};
  for (const [k, [lo, hi]] of Object.entries(ranges)){
    if (raw[k] === undefined) continue;
    if (typeof raw[k] !== 'number' || !Number.isFinite(raw[k])) return '"' + k + '" must be a number.';
    card[k] = Math.min(hi, Math.max(lo, raw[k]));
  }
  if (raw.image){
    if (typeof raw.image !== 'string' || !raw.image.startsWith('data:image/')) return '"image" must be an image data URL or empty.';
    card.image = raw.image;
  }
  for (const k of ['cropT','cropR','cropB','cropL']){
    if (raw[k] === undefined) continue;
    if (typeof raw[k] !== 'number' || !Number.isFinite(raw[k])) return '"' + k + '" must be a number.';
    card[k] = Math.min(0.9, Math.max(0, raw[k]));
  }
  if (card.cropL + card.cropR > 0.95) card.cropL = card.cropR = 0;
  if (card.cropT + card.cropB > 0.95) card.cropT = card.cropB = 0;
  card.corners = raw.corners === 'sharp' ? 'sharp' : 'rounded';
  return null;
}
function checkCustom(raw){
  const card = blankCustom();
  const txt = (v, max) => (typeof v === 'string' || typeof v === 'number') ? String(v).slice(0, max) : '';
  const hex = v => (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v)) ? v : null;
  card.name = txt(raw.name, 40); card.typeName = txt(raw.typeName, 24); card.desc = txt(raw.desc, 160);
  card.border = hex(raw.border) || card.border; card.bg = hex(raw.bg) || card.bg;
  if (raw.fields !== undefined && !Array.isArray(raw.fields)) return {error: '"fields" must be a list.'};
  for (const f of (raw.fields || []).slice(0, MAX_FIELDS)){
    if (!f || typeof f !== 'object') return {error: 'Each field must be an object.'};
    const kind = f.kind === 'int' ? 'int' : 'text';
    card.fields.push({label: txt(f.label, 24), kind, unit: txt(f.unit, 12), value: kind === 'int' ? intText(f.value) : txt(f.value, 60)});
  }
  const err = applyShared(raw, card); if (err) return {error: err};
  return {card};
}
function checkImport(raw){
  // Must be one plain object (rejects null, numbers, strings, true/false, arrays)
  if (raw === null || typeof raw !== 'object' || Array.isArray(raw))
    return {error: 'The JSON must be a single card object.'};
  if (raw.kind === 'custom') return checkCustom(raw);

  const card = blank();   // known fields only, with defaults; id stays null

  // Required: a valid type
  if (!['Armor', 'Weapon', 'Magic Item'].includes(raw.type))
    return {error: '"type" must be Armor, Weapon or Magic Item.'};
  card.type = raw.type;

  // Text fields: optional, accept text or numbers, trim to the form's max length
  for (const [k, max] of Object.entries(FIELD_LIMITS)){
    const v = raw[k];
    if (v === undefined || v === null || v === '') continue;
    if (typeof v !== 'string' && typeof v !== 'number')
      return {error: `"${k}" must be text or a number.`};
    card[k] = String(v).slice(0, max);
  }

  const err = applyShared(raw, card); if (err) return {error: err};
  card.range = RANGE_OPTIONS.includes(raw.range) ? raw.range : '';
  return {card};
}

$('import').addEventListener('click', () => {
  let raw;
  try {
    raw = JSON.parse($('import-item-json').value);
  } catch (e) {
    say('That isn’t valid JSON: ' + e.message);
    return;
  }

  const {card, error} = checkImport(raw);
  if (error){ say(error); return; }

  stash[mode] = state; state = card;                       // id is null, so the first Save creates a new card
  syncForm();                         // also re-renders the live card
  $('import-item-json').value = '';
  say('Card imported. Save it to add it to your library.');
});

/* ---------- inputs ---------- */
$('photo').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      // downscale so saved cards stay small enough for localStorage
      const max = 800, s = Math.min(1, max/Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      state.image = cv.toDataURL('image/jpeg', 0.8);
      state.zoom = 1; state.x = 0; state.y = 0; $('zoom').value = 1; resetCrop();
      renderLive();
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
});
$('name').addEventListener('input', e => { state.name = e.target.value; renderLive(); });
$('type').addEventListener('change', e => { state.type = e.target.value; $('statlabel').textContent = STAT_LABEL[state.type]; renderLive(); });
['stat','range','use','cost','etch'].forEach(k => $(k).addEventListener('input', e => { state[k] = e.target.value; renderLive(); }));
$('desc').addEventListener('input', e => { state.desc = e.target.value; $('dc').textContent = state.desc.length; renderLive(); });
$('zoom').addEventListener('input', e => setZoom(parseFloat(e.target.value)));
$('reset').addEventListener('click', () => { state.zoom = 1; state.x = 0; state.y = 0; $('zoom').value = 1; resetCrop(); renderLive(); });
function resetCrop(){ state.cropT = state.cropR = state.cropB = state.cropL = 0; }
function setTool(t){
  tool = t;
  $('tool-move').classList.toggle('on', t === 'move'); $('tool-crop').classList.toggle('on', t === 'crop');
  renderLive();
}
$('tool-move').addEventListener('click', () => setTool('move'));
$('tool-crop').addEventListener('click', () => setTool('crop'));
function updateCornersBtn(){ $('corners').textContent = 'Corners: ' + (state.corners === 'sharp' ? 'Sharp' : 'Rounded'); }
$('corners').addEventListener('click', () => {
  state.corners = state.corners === 'sharp' ? 'rounded' : 'sharp';
  updateCornersBtn(); renderLive();
});

function syncForm(){
  const cu = state.kind === 'custom';
  mode = cu ? 'custom' : 'original';
  $('tab-orig').classList.toggle('on', !cu); $('tab-cust').classList.toggle('on', cu);
  $('orig-fields').hidden = cu; $('cust-fields').hidden = !cu; $('colors').hidden = !cu;
  $('name').value = state.name; $('desc').value = state.desc;
  $('dc').textContent = state.desc.length; $('zoom').value = state.zoom; $('photo').value = '';
  if (cu){
    $('ctype').value = state.typeName; $('cborder').value = state.border; $('cbg').value = state.bg; renderFields();
  } else {
    $('type').value = state.type;
    ['stat','range','use','cost','etch'].forEach(k => { $(k).value = state[k] || ''; });
    $('statlabel').textContent = STAT_LABEL[state.type];
  }
  updateCornersBtn();
  renderLive();
}
function mk(tag, props, evt, fn){ const e = document.createElement(tag); Object.assign(e, props); if (evt) e.addEventListener(evt, fn); return e; }
function renderFields(){
  const box = $('fieldlist'); box.replaceChildren();
  state.fields.forEach((f, i) => {
    const row = mk('div', {className:'fbox'}), g = mk('div', {className:'frow'}), bar = mk('div', {className:'row'});
    const typeSel = mk('select', {}, 'change', e => {
      f.kind = e.target.value; if (f.kind === 'int') f.value = intText(f.value);
      renderFields(); renderLive();
    });
    typeSel.append(new Option('Text', 'text'), new Option('Whole number', 'int')); typeSel.value = f.kind;
    g.append(
      mk('input', {type:'text', placeholder:'Label', value:f.label, maxLength:24}, 'input', e => { f.label = e.target.value; renderLive(); }),
      typeSel,
      mk('input', {type:'text', placeholder:'Unit (optional)', value:f.unit, maxLength:12}, 'input', e => { f.unit = e.target.value; renderLive(); }),
      mk('input', {type: f.kind === 'int' ? 'number' : 'text', step:1, placeholder:'Value', value:f.value, maxLength:60}, 'input',
         e => { f.value = f.kind === 'int' ? intText(e.target.value) : e.target.value; renderLive(); }));
    bar.append(
      mk('button', {type:'button', textContent:'\u2191', disabled:i === 0}, 'click', () => moveField(i, -1)),
      mk('button', {type:'button', textContent:'\u2193', disabled:i === state.fields.length - 1}, 'click', () => moveField(i, 1)),
      mk('button', {type:'button', textContent:'Remove'}, 'click', () => { state.fields.splice(i, 1); renderFields(); renderLive(); }));
    row.append(g, bar); box.appendChild(row);
  });
}
function moveField(i, d){ const a = state.fields, j = i + d; [a[i], a[j]] = [a[j], a[i]]; renderFields(); renderLive(); }
$('ctype').addEventListener('input', e => { state.typeName = e.target.value; renderLive(); });
$('cborder').addEventListener('input', e => { state.border = e.target.value; renderLive(); });
$('cbg').addEventListener('input', e => { state.bg = e.target.value; renderLive(); });
$('addfield').addEventListener('click', () => {
  if (state.fields.length >= MAX_FIELDS){ say('Custom cards allow up to ' + MAX_FIELDS + ' fields.'); return; }
  state.fields.push({label:'', kind:'text', unit:'', value:''}); renderFields(); renderLive();
});
function switchMode(m){
  if (m === mode) return;
  stash[mode] = state;
  state = stash[m] || (m === 'custom' ? blankCustom() : blank());
  syncForm(); say('');
}
$('tab-orig').addEventListener('click', () => switchMode('original'));
$('tab-cust').addEventListener('click', () => switchMode('custom'));
function openCard(c){ stash[mode] = state; state = JSON.parse(JSON.stringify(c)); syncForm(); }
function say(t, id='msg'){ $(id).textContent = t; }

$('new').addEventListener('click', () => { state = mode === 'custom' ? blankCustom() : blank(); syncForm(); say(''); });

$('save').addEventListener('click', () => {
  if (!state.name.trim()) { say('Give the card a name first.'); return; }
  const list = loadAll();
  const rec = {...state, name: state.name.trim(), id: state.id || String(Date.now()), updated: new Date().toISOString()};
  const i = list.findIndex(c => c.id === rec.id);
  if (i >= 0) list[i] = rec; else list.unshift(rec);
  if (!saveAll(list)) { say('Browser storage is full or unavailable. Try a smaller photo or delete old cards.'); return; }
  state.id = rec.id;
  say('Saved “' + rec.name + '” to your library.');
  renderLib();
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(state)); say('Card JSON copied.'); }
  catch(e){ say('Copy isn’t available here.'); }
});

/* ---------- PNG export (drawn on a canvas, 750x1050) ---------- */
const COLORS = {Armor:'#5b7fa6', Weapon:'#b2412f', 'Magic Item':'#7b4fb0'};
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function wrapText(g,text,maxW){
  const lines=[]; let cur='';
  for (let w of text.split(/\s+/).filter(Boolean)){
    while (g.measureText(w).width > maxW){            // break very long words
      let n=w.length; while (n>1 && g.measureText(w.slice(0,n)).width > maxW) n--;
      if (cur){ lines.push(cur); cur=''; }
      lines.push(w.slice(0,n)); w=w.slice(n);
    }
    const t = cur ? cur+' '+w : w;
    if (g.measureText(t).width > maxW && cur){ lines.push(cur); cur=w; } else cur=t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }

async function cardBlob(d){
  const cu = d.kind === 'custom';
  const W=750, H=1050, tc = cu ? d.border : (COLORS[d.type]||'#777');
  const face = cu ? d.bg : '#fbf6e8', ink = cu ? textOn(d.bg) : '#2a2118';
  const R = r => d.corners === 'sharp' ? 0 : r;   // corner radius, zero when sharp
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d'); g.textBaseline='top';
  rr(g,0,0,W,H,R(48)); g.fillStyle=tc; g.fill();
  rr(g,15,15,W-30,H-30,R(36)); g.fillStyle=face; g.fill();
  // name
  g.fillStyle=ink; g.font='bold 46px Georgia, serif';
  const nl = wrapText(g,d.name||'Unnamed Equipment',670).slice(0,2);
  nl.forEach((l,i)=>g.fillText(l,40,45+i*52));
  const ul = 45 + nl.length*52 + 8;   // underline sits right under the name
  g.fillStyle=tc; g.fillRect(40,ul,670,5);
  // photo frame (fit inside, then pan + zoom, same as the live card)
  const fx=40, fy=ul+25, fw=670, fh=440;
  rr(g,fx,fy,fw,fh,R(14)); g.fillStyle='rgba(128,128,128,.18)'; g.fill();
  if (d.image){
    const im=await loadImg(d.image);
    g.save(); rr(g,fx,fy,fw,fh,R(14)); g.clip();
    const s=Math.min(fw/im.width, fh/im.height);
    g.translate(fx+fw/2+d.x*fw, fy+fh/2+d.y*fh); g.scale(d.zoom,d.zoom);
    const cw=im.width*s, ch=im.height*s, ct=d.cropT||0, cr=d.cropR||0, cb=d.cropB||0, cl=d.cropL||0;
    g.beginPath(); g.rect(-cw/2+cw*cl, -ch/2+ch*ct, cw*(1-cl-cr), ch*(1-ct-cb)); g.clip();   // crop
    g.drawImage(im,-cw/2,-ch/2,cw,ch);
    g.restore();
  }
  rr(g,fx,fy,fw,fh,R(14)); g.strokeStyle=tc; g.lineWidth=8; g.stroke();
  // type badge
  g.font='24px Georgia, serif';
  const label=(cu ? (d.typeName||'Custom') : d.type).toUpperCase().split('').join('\u200A');
  const pw=g.measureText(label).width+44;
  const py = fy+fh+25;
  rr(g,40,py,pw,44,R(22)); g.fillStyle=tc; g.fill();
  g.fillStyle = cu ? textOn(d.border) : '#fff'; g.fillText(label,62,py+10);
  // description
  const by = py+44+21, bh = 1010-by;
  rr(g,40,by,670,bh,R(16)); g.strokeStyle=tc; g.lineWidth=3; g.stroke();
  const items = lineList(d).map(t=>({t, f:''}));
  if ((d.desc||'').trim()) items.push({t:d.desc.trim(), f:'italic '});
  if (!items.length) items.push({t:'Description goes here.', f:'italic '});
  let laid = [];
  for (let size=32; size>=14; size-=2){
    laid = []; let y = 0;
    items.forEach((it,k)=>{
      g.font = it.f + size + 'px Georgia, serif';
      if (it.f && k>0) y += 8;
      wrapText(g,it.t,630).forEach(l=>{ laid.push({l, f:g.font, y}); y += Math.round(size*1.35); });
    });
    if (y <= bh-40) break;
  }
  g.fillStyle=ink;
  laid.forEach(o=>{ g.font=o.f; g.fillText(o.l,60,by+20+o.y); });
  return new Promise(r=>cv.toBlob(r,'image/png'));
}

async function exportPng(d, msgId){
  const slug=(d.name||'equipment-card').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'equipment-card';
  try {
    // 1) Inside Claude the viewer provides its own save prompt.
    const dl = window.claude ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename: slug+'.png', data: await cardBlob(d)}); say('PNG ready.', msgId); return; }

    // 2) Chrome, Edge, Opera: a real Save As window. Ask first, while the click still counts as a user action.
    let handle = null;
    if (window.showSaveFilePicker){
      try {
        handle = await window.showSaveFilePicker({suggestedName: slug+'.png', types:[{description:'PNG image', accept:{'image/png':['.png']}}]});
      } catch(e){
        if (e && e.name === 'AbortError'){ say('Export cancelled.', msgId); return; }   // closed the dialog
        // any other error (blocked in this context): fall through to a normal download
      }
    }
    const blob = await cardBlob(d);
    if (handle){
      const w = await handle.createWritable(); await w.write(blob); await w.close();
      say('PNG saved.', msgId);
      return;
    }

    // 3) Firefox, Safari and anything else: normal download to the browser's download folder.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = slug+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say('PNG downloaded. Your browser chooses the folder; turn on “Always ask where to save files” in its download settings to pick one each time.', msgId);
  } catch(e){
    say(e && e.code==='declined' ? 'Download cancelled.' : 'Couldn’t export the PNG.', msgId);
  }
}
$('png').addEventListener('click', () => exportPng(state, 'msg'));

/* ---------- library: search + filter ---------- */
function renderLib(){
  const q = $('q').value.trim().toLowerCase(), t = $('ft').value;
  const hits = loadAll().filter(c =>
    (!t || (t === 'Custom' ? c.kind === 'custom' : c.kind !== 'custom' && c.type === t)) &&
    (!q || searchText(c).includes(q)));
  const lib = $('lib'); lib.replaceChildren();
  if (!hits.length){
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = loadAll().length ? 'No cards match your search.' : 'No saved cards yet.';
    lib.appendChild(p); return;
  }
  hits.forEach(c => {
    const item = document.createElement('div'); item.className = 'item';
    item.appendChild(buildCard(c, false));
    const row = document.createElement('div'); row.className = 'row';
    const ed = document.createElement('button'); ed.textContent = 'Edit';
    ed.onclick = () => { openCard(c); say('Editing “' + c.name + '”.'); window.scrollTo({top:0, behavior:'smooth'}); };
    const del = document.createElement('button'); del.textContent = 'Delete';
    del.onclick = () => { saveAll(loadAll().filter(x => x.id !== c.id)); renderLib(); };
    const pg = document.createElement('button'); pg.textContent = 'PNG';
    pg.onclick = () => exportPng(c, 'libmsg');
    row.append(ed, pg, del); item.appendChild(row); lib.appendChild(item); fitDesc(item); applyCrops(item);
  });
}
$('q').addEventListener('input', renderLib);
$('ft').addEventListener('change', renderLib);

syncForm(); renderLib();
</script>
